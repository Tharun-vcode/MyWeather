<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .weather-card { 
            margin: 2em auto; 
            padding: 2em; 
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        .current-weather {
            display: inline-block;
            margin-bottom: 2em;
        }
        .forecast-section {
            margin-top: 2em;
        }
        input, button { 
            padding: 0.8em 1.2em; 
            font-size: 1em; 
            border: none;
            border-radius: 8px;
            margin: 0.5em;
        }
        input {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            outline: none;
        }
        input:focus {
            border-color: #74b9ff;
        }
        button {
            background: #74b9ff;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0984e3;
        }
        img { 
            vertical-align: middle; 
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin: 2em 0;
            background: white;
            border-radius: 10px;
            padding: 20px;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
        }
        .loading {
            color: #74b9ff;
            font-style: italic;
        }
        h2 {
            color: #2d3436;
            margin-bottom: 1em;
        }
        h3 {
            color: #0984e3;
            margin: 1em 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="weather-card">
            <h2>🌦️ Weather Forecast</h2>
            <input type="text" id="cityInput" placeholder="Enter city name" onkeypress="handleKeyPress(event)">
            <button onclick="getWeather()">Get Weather</button>
            
            <div id="weatherResult" style="margin-top:2em;"></div>
            
            <div class="forecast-section">
                <h3>📊 5-Day Temperature Forecast</h3>
                <div id="chartContainer" class="chart-container" style="display:none;">
                    <canvas id="weatherChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let weatherChart = null;

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                getWeather();
            }
        }

        function getWeather() {
            var city = document.getElementById('cityInput').value;
            if (!city) {
                document.getElementById('weatherResult').innerHTML = '<div class="error">Please enter a city name!</div>';
                return;
            }

            document.getElementById('weatherResult').innerHTML = '<div class="loading">Loading weather data...</div>';
            document.getElementById('chartContainer').style.display = 'none';

            fetch(`/weather?city=${encodeURIComponent(city)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        let errorHtml = `<div class="error">${data.error}</div>`;
                        if (data.suggestions) {
                            errorHtml += '<div style="margin-top: 1em;"><strong>Available options:</strong><ul style="text-align: left; display: inline-block;">';
                            data.suggestions.forEach(suggestion => {
                                errorHtml += `<li>${suggestion}</li>`;
                            });
                            errorHtml += '</ul></div>';
                        }
                        document.getElementById('weatherResult').innerHTML = errorHtml;
                    } else {
                        // Display current weather
                        const current = data.current;

                        const sunriseTime = new Date(current.sunrise * 1000).toLocaleTimeString();
                        const sunsetTime = new Date(current.sunset * 1000).toLocaleTimeString();

                        document.getElementById('weatherResult').innerHTML = `
                             <div class="current-weather">
                                 <h3>${current.city_name}</h3>
                                 <img src="https://openweathermap.org/img/wn/${current.icon}@2x.png" alt="${current.condition}" />
                                 <p><strong>Temperature:</strong> ${current.temp.toFixed(1)} °C (Feels like ${current.feels_like.toFixed(1)} °C)</p>
                                 <p><strong>Humidity:</strong> ${current.humidity}%</p>
                                 <p><strong>Pressure:</strong> ${current.pressure} hPa</p>
                                 <p><strong>Wind Speed:</strong> ${current.wind_speed} m/s</p>
                                 <p><strong>Visibility:</strong> ${current.visibility} km</p>
                                 <p><strong>Sunrise:</strong> ${sunriseTime}</p>
                                 <p><strong>Sunset:</strong> ${sunsetTime}</p>
                                 <p><strong>Condition:</strong> ${current.condition}</p>
                            </div>
`;

                        // Create forecast chart
                        if (data.forecast && data.forecast.length > 0) {
                            createForecastChart(data.forecast);
                            document.getElementById('chartContainer').style.display = 'block';
                        }
                    }
                })
                .catch(error => {
                    document.getElementById('weatherResult').innerHTML = '<div class="error">Failed to fetch weather data. Please try again.</div>';
                    console.error('Error:', error);
                });
        }

        function createForecastChart(forecastData) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            
            // Destroy existing chart if it exists
            if (weatherChart) {
                weatherChart.destroy();
            }

            // Prepare data for the chart
            const labels = forecastData.map(day => {
                const date = new Date(day.date * 1000);
                return date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric' 
                });
            });

            const maxTemps = forecastData.map(day => day.temp_max);
            const minTemps = forecastData.map(day => day.temp_min);

            weatherChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Max Temperature (°C)',
                            data: maxTemps,
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            borderWidth: 3,
                            fill: false,
                            tension: 0.4,
                            pointBackgroundColor: '#e74c3c',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 6
                        },
                        {
                            label: 'Min Temperature (°C)',
                            data: minTemps,
                            borderColor: '#74b9ff',
                            backgroundColor: 'rgba(116, 185, 255, 0.1)',
                            borderWidth: 3,
                            fill: false,
                            tension: 0.4,
                            pointBackgroundColor: '#74b9ff',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20
                            }
                        },
                        title: {
                            display: true,
                            text: 'Temperature Forecast',
                            font: {
                                size: 16,
                                weight: 'bold'
                            },
                            color: '#2d3436'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Temperature (°C)',
                                font: {
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Date',
                                font: {
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    elements: {
                        point: {
                            hoverRadius: 8
                        }
                    }
                }
            });
        }

        // Load weather for a default city on page load (optional)
        // getWeather();
    </script>
</body>

</html>
